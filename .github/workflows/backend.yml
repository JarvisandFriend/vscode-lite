name: backend
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: backend
  cancel-in-progress: true
jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd server && npm install --no-audit --no-fund
      - name: Start backend and Cloudflare tunnel
        run: |
          git config user.name dev
          git config user.email dev@users.noreply.github.com
          nohup node server/server.js > server.log 2>&1 &
          sleep 3
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --no-autoupdate --url http://localhost:3000 > cf.log 2>&1 &
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cf.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          echo "URL: $URL" | tee -a $GITHUB_STEP_SUMMARY
          echo "$URL" | grep -Eq '^https://[a-z0-9-]+\.trycloudflare\.com$' || { echo "bad url: $URL"; cat cf.log server.log; exit 1; }
          OK=0
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -m 5 -w '%{http_code}' "$URL/" || true)
            echo "ping $i: $CODE"
            if [ "$CODE" != "000" ] && [ "$CODE" -lt 500 ]; then OK=1; break; fi
            sleep 3
          done
          if [ "$OK" != 1 ]; then echo "unreachable"; cat cf.log server.log; exit 1; fi
          echo "REACHABLE: $URL" | tee -a $GITHUB_STEP_SUMMARY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B tunnel
          echo "{\"url\":\"$URL\",\"ts\":$(date +%s)}" > tunnel.json
          git add tunnel.json
          git commit -m "tunnel: $URL" || true
          git push -u origin tunnel --force
          echo "PUBLISHED tunnel to branch tunnel" | tee -a $GITHUB_STEP_SUMMARY
          if [ -n "${{ secrets.GIST_TOKEN }}" ]; then
            GH_TOKEN=${{ secrets.GIST_TOKEN }} gh api -X PATCH gists/862321431bac372752a422b9cca2fe01 -f "files[tunnel.json][content]={\"url\":\"$URL\",\"ts\":$(date +%s)}" > /dev/null 2>&1 || true
          fi
      - name: Keep alive (5h)
        run: sleep 18000
