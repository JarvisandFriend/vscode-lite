name: backend
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: backend
  cancel-in-progress: true
jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd server && npm install --no-audit --no-fund
      - name: Start backend and Cloudflare tunnel
        run: |
          git config user.name dev
          git config user.email dev@users.noreply.github.com
          mkdir -p "$HOME/workspace"
          (
            set -e
            cd "$HOME/workspace"
            git init -q -b workspace
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git remote add origin "https://github.com/${{ github.repository }}.git"
            git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' '${{ github.token }}' | base64 -w0)"
            if git fetch -q origin workspace; then
              git reset -q --hard FETCH_HEAD
            else
              printf 'node_modules/\n.env\n*.log\n' > .gitignore
              printf '# Workspace\n' > README.md
              git add -A
              git commit -qm "init workspace"
            fi
            git push -q -u origin workspace
          ) || echo "WARN: workspace setup failed"
          nohup bash -c 'while true; do sleep 60; cd "$HOME/workspace" || continue; git add -A; git diff --cached --quiet || { git commit -qm autosave && git push -q origin workspace; }; done' > autosave.log 2>&1 &
          WORKSPACE="$HOME/workspace" nohup node server/server.js > server.log 2>&1 &
          sleep 3
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --no-autoupdate --url http://localhost:3000 > cf.log 2>&1 &
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cf.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          echo "URL: $URL" | tee -a $GITHUB_STEP_SUMMARY
          echo "$URL" | grep -Eq '^https://[a-z0-9-]+\.trycloudflare\.com$' || { echo "bad url: $URL"; cat cf.log server.log; exit 1; }
          OK=0
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -m 5 -w '%{http_code}' "$URL/" || true)
            echo "ping $i: $CODE"
            if [ "$CODE" != "000" ] && [ "$CODE" -lt 500 ]; then OK=1; break; fi
            sleep 3
          done
          if [ "$OK" != 1 ]; then echo "unreachable"; cat cf.log server.log; exit 1; fi
          echo "REACHABLE: $URL" | tee -a $GITHUB_STEP_SUMMARY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B tunnel
          echo "{\"url\":\"$URL\",\"ts\":$(date +%s)}" > tunnel.json
          git add tunnel.json
          git commit -m "tunnel: $URL" || true
          git push -u origin tunnel --force
          echo "PUBLISHED tunnel to branch tunnel" | tee -a $GITHUB_STEP_SUMMARY
      - name: Keep alive (5h)
        run: sleep 18000
      - name: Save workspace
        if: always()
        run: |
          cd "$HOME/workspace" 2>/dev/null || exit 0
          git add -A
          git diff --cached --quiet || { git commit -qm "save on shutdown"; git push -q origin workspace || true; }
