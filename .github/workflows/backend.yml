name: backend
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: backend
  cancel-in-progress: true
jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd server && npm install --no-audit --no-fund
      - name: Start backend and Cloudflare tunnel
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          git config user.name dev
          git config user.email dev@users.noreply.github.com
          nohup node server/server.js > server.log 2>&1 &
          sleep 3
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --no-autoupdate --url http://localhost:3000 > cf.log 2>&1 &
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cf.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          echo "URL: $URL" | tee -a $GITHUB_STEP_SUMMARY
          [ -z "$URL" ] && cat cf.log
      - name: Keep alive (5h)
        run: sleep 18000
