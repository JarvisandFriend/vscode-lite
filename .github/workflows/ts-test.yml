name: ts-test
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -o tok.json -d "client_id=${{ secrets.TS_OAUTH_CLIENT_ID }}" -d "client_secret=${{ secrets.TS_OAUTH_SECRET }}" https://api.tailscale.com/api/v2/oauth/token
          T=$(jq -r .access_token tok.json)
          CODE=$(curl -s -o out.json -w "%{http_code}" -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:ci"]}}},"expirySeconds":60}' https://api.tailscale.com/api/v2/tailnet/-/keys)
          echo "HTTP $CODE"
          if [ "$CODE" != "200" ]; then cat out.json; fi
