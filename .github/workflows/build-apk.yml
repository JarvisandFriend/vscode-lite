name: Build APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set version
        id: ver
        run: |
          CODE=$((100 + ${{ github.run_number }}))
          NAME="1.0.${{ github.run_number }}"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Install deps
        run: npm ci
      - name: Ensure TypeScript is present
        run: npm ls typescript --depth=0 || npm install -D typescript
      - name: Build web app
        run: npm run build
        env:
          VITE_API_URL: https://rtgcortex-vscode-lite.hf.space
          VITE_WS_URL: wss://rtgcortex-vscode-lite.hf.space
          VITE_GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
      - name: Add Android platform (if missing)
        run: rm -rf android && npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Generate app icons
        run: npx capacitor-assets generate --android
      - name: Set versionCode/versionName in build.gradle
        working-directory: android
        run: |
          sed -i "s/versionCode .*/versionCode ${{ steps.ver.outputs.code }}/" app/build.gradle
          sed -i "s/versionName .*/versionName \"${{ steps.ver.outputs.name }}\"/" app/build.gradle
      - name: Use stable debug keystore
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Debug signing config
        working-directory: android
        run: |
          echo "--- build.gradle signing/buildTypes ---"
          grep -A15 "signingConfigs\|buildTypes" app/build.gradle || echo "no match found"
          echo "--- keystore in use ---"
          ls -la ~/.android/debug.keystore
          sha256sum ~/.android/debug.keystore
          echo "--- committed keystore for comparison ---"
          sha256sum ../keystore/debug.keystore
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            out/vscode-lite-${{ steps.ver.outputs.name }}.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: v${{ steps.ver.outputs.name }}
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
